<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="qBittorrent 下载管理">
    <title>qBittorrent</title>
    <!-- These icons are served by qBittorrent's existing public resources. -->
    <link rel="icon" type="image/png" href="./images/qbittorrent32.png" sizes="32x32" vite-ignore>
    <link rel="icon" type="image/svg+xml" href="./images/qbittorrent-tray.svg" sizes="any" vite-ignore>
    <script>
      try {
        const preference = localStorage.getItem('qbt-appearance');
        document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
